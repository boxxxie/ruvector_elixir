name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/ruvector_nif/target
      RUVECTOR_BUILD: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20.5"
            otp: "29.1.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust cargo and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ruvector_nif

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Cache Mix dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-${{ hashFiles('mix.lock', 'native/ruvector_nif/Cargo.lock', 'native/ruvector_nif/Cargo.toml', 'native/ruvector_nif/src/**') }}
          restore-keys: |
            ${{ runner.os }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-

      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/ruvector_nif/Cargo.toml -- --check

      - name: Run Rust clippy
        run: cargo clippy --manifest-path native/ruvector_nif/Cargo.toml --all-targets -- -D warnings

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        env:
          MIX_ENV: test
        run: mix compile --warnings-as-errors

      - name: Run ExUnit test suite
        run: mix test
