[package]
name = "ruvector_nif"
version = "0.2.0"
authors = []
edition = "2021"
rust-version = "1.91"

[lib]
name = "ruvector_nif"
crate-type = ["cdylib"]

[dependencies]
parking_lot = "0.12"
rustler = "0.38.0"
ruvector-core = "2.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
